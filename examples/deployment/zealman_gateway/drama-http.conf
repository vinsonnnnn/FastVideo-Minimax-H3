# Bootstrap only: obtain a certificate before enabling drama-https.conf.
# Add as a separate virtual host; preserve the existing default site.
server {
    listen 80;
    server_name drama.lianchengtech.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /data/zealman-gateway/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
