# Independent presentation layer; the original GPU panel stays unchanged.
server {
    listen 127.0.0.1:16018;
    server_name _;
    root /data/liancheng-panel/current;
    client_max_body_size 512m;
    client_body_timeout 300s;

    location ^~ /studio-api/ {
        proxy_pass http://127.0.0.1:16128/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:16128/gateway/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
    }
    location = /config.json {
        proxy_pass http://127.0.0.1:16128/gateway/config.json;
        proxy_set_header Host $http_host;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
        add_header Clear-Site-Data '"cache"';
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Clear-Site-Data '"cache"';
    }
    location = /api/platform {
        alias /data/liancheng-panel/platform.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location = /app.yaml {
        default_type text/plain;
        return 200 "";
    }
    location = /image/qq.png { return 404; }
    location = /image/avatar.png { return 404; }
    location = /favicon.ico {
        alias /data/liancheng-panel/current/brand.svg;
        types { }
        default_type image/svg+xml;
    }
    location /assets/ {
        try_files $uri @gpu_panel;
        add_header Cache-Control "no-store";
    }
    location ~ ^/assets/.*\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
    location = /studio.css {
        add_header Cache-Control "no-store";
    }
    location = /studio-home.css {
        add_header Cache-Control "no-store";
    }
    location = /studio-home.js {
        add_header Cache-Control "no-store";
    }
    location /image/ { try_files $uri @gpu_panel; }
    location /html/ { try_files $uri @gpu_panel; }
    location = /brand.svg { }
    location / { try_files $uri @gpu_panel; }

    location @gpu_panel { return 403; }
}
