# Enable only after certificate issuance and nginx -t succeeds.
server {
    listen 80;
    server_name drama.lianchengtech.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /data/zealman-gateway/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://drama.lianchengtech.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name drama.lianchengtech.cn;

    ssl_certificate /etc/letsencrypt/live/drama.lianchengtech.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drama.lianchengtech.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/drama-access.log;
    error_log /var/log/nginx/drama-error.log;
    client_max_body_size 512m;
    client_body_timeout 300s;

    location / {
        # Account sessions protect APIs; payment callbacks authenticate signatures.
        auth_basic off;

        proxy_pass http://127.0.0.1:16018;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The gateway credentials belong to nginx, not the upstream API.
        proxy_set_header Authorization "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
