# Include inside the existing port-80 IP/default server block.
location = /lichtv { return 308 /lichtv/; }

location ^~ /lichtv/ {
    # Homepage is public; account API enforces generation and file authorization.
    auth_basic off;
    client_max_body_size 512m;
    client_body_timeout 300s;

    proxy_pass http://127.0.0.1:16028/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /lichtv;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Authorization "";
    proxy_redirect ~^(/.*)$ /lichtv$1;
    proxy_cookie_path / /lichtv/;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
}
