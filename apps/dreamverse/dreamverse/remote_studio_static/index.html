<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H3 远程镜头测试</title>
  <script src="/studio.js" defer></script>
  <style>
    :root { color-scheme: dark; font-family: system-ui,sans-serif; background: #10131a; color: #e8edf5; }
    body { max-width: 1000px; margin: 48px auto; padding: 0 24px; }
    h1 { font-weight: 600; } p { color: #b1bdd0; line-height: 1.7; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    section { background: #1a2030; padding: 24px; border-radius: 16px; min-width: 0; }
    label { display: block; margin: 18px 0 8px; }
    textarea,input,button { font: inherit; box-sizing: border-box; }
    textarea { width: 100%; resize: vertical; padding: 12px; }
    input[type=number] { width: 100%; padding: 8px; }
    input[type=file] { width: 100%; min-width: 0; }
    button,.download { display: inline-block; padding: 12px 18px; border: 0; border-radius: 8px; background: #9cc9ff; color: #10203a; cursor: pointer; margin-top: 20px; }
    button:disabled { opacity: .5; cursor: wait; } img,video { width: 100%; max-height: 300px; object-fit: contain; margin-top: 12px; border-radius: 8px; }
    #error { color: #ffb2b2; white-space: pre-wrap; } #mode { color: #e8d298; } small { overflow-wrap: anywhere; color: #b1bdd0; }
    [hidden] { display: none !important; } @media(max-width:700px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>H3 远程镜头测试</h1>
  <p>上传一张角色或场景参考图，描述画面、动作与声音，生成一个可播放、可下载的镜头。</p>
  <p id="connection" role="status">正在连接后端…</p>
  <p id="mode"></p>
  <main>
    <section>
      <form id="form">
        <label for="reference">参考图 · PNG / JPEG / WebP，最大 15 MiB</label>
        <input id="reference" type="file" accept="image/png,image/jpeg,image/webp" required>
        <img id="reference-preview" alt="所选参考图" hidden>
        <label for="prompt">镜头描述</label>
        <textarea id="prompt" rows="7" maxlength="12000" required>A person turns toward the camera and smiles. The camera slowly moves closer. Soft room ambience and gentle music.</textarea>
        <label for="seed">随机种子</label>
        <input id="seed" type="number" min="0" max="4294967295" step="1" value="1234" required>
        <button id="submit" disabled>生成镜头</button>
      </form>
    </section>
    <section>
      <h2>生成结果</h2>
      <p id="status" role="status" aria-live="polite">等待提交镜头。</p>
      <p id="error" role="alert" hidden></p>
      <video id="video" controls playsinline hidden></video>
      <a id="download" class="download" hidden>下载 MP4</a>
      <button id="resume" type="button" hidden>重新查询任务</button>
      <p><small id="job"></small></p>
      <p>生成期间可继续修改下一个镜头的描述。页面断开不会自动取消任务。</p>
    </section>
  </main>
</body>
</html>
